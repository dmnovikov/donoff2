; Tests of the core run on the PC: test/run.sh
; One environment per board: pio run -e <name>
[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    paulstoffregen/OneWire
    knolleary/PubSubClient
    tzapu/WiFiManager
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[esp8266]
platform = espressif8266
board = d1_mini

; The bench socket and every V1 socket
[env:d1_mini]
extends = esp8266
build_flags = -DBOARD=BoardSocket -DPINS=PINS_V1

[env:v2]
extends = esp8266
build_flags = -DBOARD=BoardSocket -DPINS=PINS_V2

[env:v3]
extends = esp8266
build_flags = -DBOARD=BoardSocket -DPINS=PINS_V3

[env:single]
extends = esp8266
build_flags = -DBOARD=BoardSocketSingle -DPINS=PINS_V2

[env:current]
extends = esp8266
build_flags = -DBOARD=BoardSocketCurrent -DPINS=PINS_V2

[env:pump]
extends = esp8266
build_flags = -DBOARD=BoardPump -DPINS=PINS_V2

[env:ds2]
extends = esp8266
build_flags = -DBOARD=BoardSocketDs2 -DPINS=PINS_V2

[env:tempodds]
extends = esp8266
build_flags = -DBOARD=BoardTempOdds -DPINS=PINS_V2

[env:dht]
extends = esp8266
build_flags = -DBOARD=BoardSocketDht -DPINS=PINS_V2

[env:ads]
extends = esp8266
build_flags = -DBOARD=BoardSocketAds -DPINS=PINS_V2

[env:lux]
extends = esp8266
build_flags = -DBOARD=BoardSocketLux -DPINS=PINS_V2

; SDA GPIO4, SCL GPIO13; ADDR of the sensor to GND (0x23)
[env:bh1750]
extends = esp8266
build_flags = -DBOARD=BoardSocketBh1750 -DPINS=PINS_V1

; One relay: BH1750 on D2 (SDA, GPIO4) and D6 (SCL, GPIO12)
[env:bh1750_1r]
extends = esp8266
build_flags = -DBOARD=BoardSocketBh1750 -DPINS=PINS_V1_1R -DI2C_SDA=4 -DI2C_SCL=12

; BME280 on D2 (SDA) and D7 (SCL); SDO to GND (0x76) or to 3.3 V (0x77)
[env:bme280]
extends = esp8266
build_flags = -DBOARD=BoardSocketBme280 -DPINS=PINS_V1

; One relay: BME280 on D2 (SDA, GPIO4) and D6 (SCL, GPIO12)
[env:bme280_1r]
extends = esp8266
build_flags = -DBOARD=BoardSocketBme280 -DPINS=PINS_V1_1R -DI2C_SDA=4 -DI2C_SCL=12

[env:pzem]
extends = esp8266
build_flags = -DBOARD=BoardPzem -DPINS=PINS_V1

[env:sct013]
extends = esp8266
build_flags = -DBOARD=BoardSct013 -DPINS=PINS_V1

[env:sct013x3]
extends = esp8266
build_flags = -DBOARD=BoardSct013x3 -DPINS=PINS_V1

[env:temps5]
extends = esp8266
build_flags = -DBOARD=Board5Temp -DPINS=PINS_V1

; The screen takes D1 and D2, that is why one relay
[env:display]
extends = esp8266
build_flags = -DBOARD=BoardSocketSingle -DPINS=PINS_V2 -DDONOFF_DISPLAY
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:esp32r4]
platform = espressif32
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = -DBOARD=BoardEsp32R4 -DPINS=PINS_ESP32R4
